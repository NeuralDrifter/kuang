  '@types/marked-terminal': ^6.1.1
  "@types/node": ^24
  "@types/tar-stream": ^3.1.4
  "@types/yauzl": ^3.4.0
  ajv: ^8.20.0
  boxen: ^8.0.1
  chalk: ^5.6.2
  marked: ^18.0.12
  marked-terminal: ^7.3.0
  picocolors: ^1.1.1
  smol-toml: ^1.4.2
  tar-stream: ^3.2.0
  tsx: ^4.23.0
  typescript: ^5
  undici: ^6.27.0
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  yaml: ^2.8.3
